name: Build & installer

on:
  push:
    branches: [ main, 'release/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # installer on GitHub Releases + status branch

jobs:
  linux-checks:
    name: Plugin check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEUP_BUILD_PLUGIN=OFF -DEUP_BUILD_CHECKS=ON
      - name: Build
        run: cmake --build build --parallel --target eup_plugin_check
      - name: Plugin check (levels, mono bass, bypass, reverb, state, editor)
        run: xvfb-run -a ./build/eup_plugin_check_artefacts/Release/eup_plugin_check

  windows:
    name: Windows VST3 + Standalone + installer
    runs-on: windows-latest
    needs: linux-checks
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}";
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then V="${GITHUB_REF#refs/heads/release/}";
          else V="1.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          cmake -S . -B build -A x64 -DEUP_BUILD_CHECKS=ON 2>&1 | Tee-Object -FilePath logs/1-configure.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel --target Euphoria_VST3 Euphoria_Standalone eup_plugin_check -- /v:minimal 2>&1 | Tee-Object -FilePath logs/2-build.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Plugin check (levels, mono bass, bypass, reverb, state, editor)
        shell: pwsh
        run: |
          build\eup_plugin_check_artefacts\Release\eup_plugin_check.exe 2>&1 | Tee-Object -FilePath logs/4-plugin-check.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "$env:TEMP\eup_editor_*.png" logs\ -ErrorAction SilentlyContinue

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\Euphoria.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip VST3 bundle
        shell: pwsh
        run: Compress-Archive -Path "build\Euphoria_artefacts\Release\VST3\Euphoria.vst3" -DestinationPath "dist\Euphoria-${{ steps.version.outputs.version }}-VST3.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Euphoria-${{ steps.version.outputs.version }}-Windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Draft release (release/* branches - not published; the owner publishes it)
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Euphoria ${{ steps.version.outputs.version }}"
          draft: true
          files: |
            dist/*.exe
            dist/*.zip

      - name: Push logs (ci-logs branch)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/l && cp -r logs/. /tmp/l/ 2>/dev/null || true
          echo "job status: ${{ job.status }}" > /tmp/l/0-summary.txt
          set +e +o pipefail
          for f in /tmp/l/*.txt; do grep -nE "error|Error|FAILED|FAIL" "$f" | head -200 > "$f.errors"; tail -c 200000 "$f" > "$f.tail"; mv "$f.tail" "$f"; done
          git config --global user.name "ci"; git config --global user.email "ci@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/repo
          cd /tmp/repo && git checkout --orphan ci-logs-new && git rm -rf . > /dev/null && cp /tmp/l/* . && git add . && git commit -m "CI logs ${{ github.sha }}" && git push -f origin ci-logs-new:ci-logs

      - name: Publish test build (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: "Test build (latest main)"
          prerelease: true
          make_latest: false
          body: "Automatic test build of the latest main branch commit. Run the installer (.exe), or unzip the VST3 into C:\\Program Files\\Common Files\\VST3."
          files: |
            dist/*.exe
            dist/*.zip

  macos:
    name: macOS VST3 + AU + Standalone + installer (universal)
    runs-on: macos-latest
    needs: linux-checks
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}";
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then V="${GITHUB_REF#refs/heads/release/}";
          else V="1.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          mkdir -p logs
          cmake -S . -B build -G Xcode -DEUP_BUILD_CHECKS=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 2>&1 | tee logs/1-configure.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 --target Euphoria_VST3 Euphoria_AU Euphoria_Standalone eup_plugin_check -- -quiet 2>&1 | tee logs/2-build.txt

      - name: Tests
        run: |
          set -o pipefail
          build/eup_plugin_check_artefacts/Release/eup_plugin_check 2>&1 | tee logs/4-plugin-check.txt

      - name: Package (.pkg)
        run: |
          set -e
          V="${{ steps.version.outputs.version }}"
          A=build/Euphoria_artefacts/Release
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Applications"
          cp -R "$A/VST3/"*.vst3 "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "$A/AU/"*.component "$ROOT/Library/Audio/Plug-Ins/Components/"
          cp -R "$A/Standalone/"*.app "$ROOT/Applications/"
          for b in "$ROOT"/Library/Audio/Plug-Ins/VST3/*.vst3 "$ROOT"/Library/Audio/Plug-Ins/Components/*.component "$ROOT"/Applications/*.app; do
            codesign --force --deep --sign - "$b"
          done
          mkdir -p dist
          pkgbuild --root "$ROOT" --identifier com.ephoric.euphoria --version "${V%%-*}" --install-location / "dist/Euphoria-$V-macOS.pkg"

      - name: Push logs (ci-logs-mac branch)
        if: always()
        run: |
          set +e +o pipefail
          mkdir -p /tmp/l && cp -r logs/. /tmp/l/ 2>/dev/null
          echo "job status: ${{ job.status }}" > /tmp/l/0-summary.txt
          for f in /tmp/l/*.txt; do grep -nE "error|Error|FAILED|FAIL" "$f" | head -200 > "$f.errors"; tail -c 200000 "$f" > "$f.tail"; mv "$f.tail" "$f"; done
          git config --global user.name "ci"; git config --global user.email "ci@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/repo
          cd /tmp/repo && git checkout --orphan ci-logs-mac-new && git rm -rf . > /dev/null && cp /tmp/l/* . && git add . && git commit -m "CI mac logs ${{ github.sha }}" && git push -f origin ci-logs-mac-new:ci-logs-mac

      - name: Publish test build (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: "Test build (latest main)"
          prerelease: true
          make_latest: false
          files: dist/*.pkg

  status:
    name: Report status to the ci-status branch
    runs-on: ubuntu-latest
    needs: [ linux-checks, windows, macos ]
    if: always() && github.event_name == 'push'
    steps:
      - name: Write status
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" repo
          cd repo
          git checkout --orphan ci-status-new
          git rm -rf . > /dev/null
          printf "commit=%s\nrun=%s\nlinux=%s\nwindows=%s\nmacos=%s\nurl=%s/%s/actions/runs/%s\n" "${{ github.sha }}" "${{ github.run_number }}" "${{ needs.linux-checks.result }}" "${{ needs.windows.result }}" "${{ needs.macos.result }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" > STATUS.txt
          git add STATUS.txt
          git commit -m "CI status ${{ github.sha }}"
          git push -f origin ci-status-new:ci-status
